{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select Movie</h1>
    <ul>
        {% for movie in movies %}
        <li>
            <a href="{{ url_for('add_to_db', movie_id=movie.id) }}">
                {{ movie.title }} - {{ movie.release_date.split('-')[0] }}
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
