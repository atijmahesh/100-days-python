{% extends 'base.html' %}

{% block title %}Edit Movie{% endblock %}

{% block content %}
<div class="content">
  <h1 class="heading">{{ movie.title }}</h1>
  <p class="description">Edit Movie Details</p>
  
  <!-- Form to edit movie rating and review -->
  <form method="POST">
    <div class="form-group">
      <label for="rating">New Rating</label>
      <input type="text" id="rating" name="rating" value="{{ movie.rating }}" class="form-control">
    </div>
    <div class="form-group">
      <label for="review">New Review</label>
      <textarea id="review" name="review" class="form-control">{{ movie.review }}</textarea>
    </div>
    <button type="submit" class="button">Save</button>
  </form>
</div>
{% endblock %}
