{% extends 'base.html' %}

{% block title %}Add Movie{% endblock %}

{% block content %}
<div class="content">
    <h1 class="heading">Add a Movie</h1>
    <form method="POST" action="{{ url_for('add') }}">
        <div class="form-group">
            <label for="title">Movie Title</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="Enter movie title" required>
        </div>
        <button type="submit" class="button">Search Movie</button>
    </form>
</div>
{% endblock %}
